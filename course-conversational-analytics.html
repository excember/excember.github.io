<!DOCTYPE html><html><head><meta charset="utf-8"><title>Winning the Conversational Analytics Conversation</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0e1116;font-family:Inter,Arial,sans-serif;color:#fff}
  .app{max-width:900px;margin:0 auto;padding:32px 28px 40px;min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .topbar img{height:20px}
  .eyebrow{font:500 12px/1 "JetBrains Mono",monospace;color:#85b4ff;letter-spacing:.04em;text-transform:uppercase}
  .progress-wrap{margin-bottom:28px}
  .progress{height:6px;background:#2a2f38;border-radius:3px;overflow:hidden;margin-bottom:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#007fff,#bd50ff);transition:width .3s}
  .progress-label{font:500 12px/1 "JetBrains Mono",monospace;color:#6b6f78;letter-spacing:.03em}
  .stage{flex:1;background:#161a20;border-radius:20px;padding:32px;max-height:520px;overflow-y:auto}
  h1{font:700 24px/1.3 Inter,sans-serif;margin:0 0 14px}
  h2{font:700 18px/1.3 Inter,sans-serif;margin:0 0 10px}
  p{font:400 16px/1.55 Inter,sans-serif;color:#b0b2b8;margin:0 0 16px}
  .muted{color:#6b6f78}
  a{color:#85b4ff}
  a:hover{color:#a0c9ff}
  .btn{padding:14px 22px;border-radius:12px;background:#306bea;color:#fff;font:700 15px/1 Inter,sans-serif;border:none;cursor:pointer;min-height:44px}
  .btn:hover{background:#2e60cf}
  .btn:disabled{opacity:.35;cursor:default}
  .btn-ghost{background:transparent;border:1px solid #2a2f38;color:#fff}
  .btn-ghost:hover{border-color:#494a4c}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .poll{display:flex;flex-direction:column;gap:10px;margin:20px 0}
  .poll-card{border:1px solid #2a2f38;background:#1e232b;border-radius:14px;padding:16px 18px;font:600 16px/1.3 Inter,sans-serif;cursor:pointer;min-height:44px;display:flex;align-items:center}
  .poll-card.selected{border-color:#306bea;background:#16223d}
  .card{border:1px solid #2a2f38;background:#1e232b;border-radius:14px;padding:16px 18px;margin-bottom:10px;font:500 15px/1.4 Inter,sans-serif;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px}
  .card.correct{border-color:#47a54e;background:#0f2415}
  .card.incorrect{border-color:#d51a11;background:#381913}
  .card[disabled],.card.disabled{cursor:default}
  .callout{border:1px solid #306bea;background:#16223d;border-radius:14px;padding:18px 20px;font:700 17px/1.5 Inter,sans-serif;margin:16px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
  .panel{border:1px solid #2a2f38;border-radius:14px;padding:18px}
  .panel h3{font:700 14px/1 "JetBrains Mono",monospace;letter-spacing:.03em;text-transform:uppercase;color:#6b6f78;margin:0 0 10px}
  .counters{display:flex;gap:20px;margin-top:12px}
  .counter{text-align:center}
  .counter .num{font:800 30px/1 Inter,sans-serif;color:#306bea}
  .counter .lbl{font:400 12px/1.3 Inter,sans-serif;color:#6b6f78}
  .match-row{display:flex;gap:24px;margin:16px 0}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px}
  .match-item{border:1px solid #2a2f38;background:#1e232b;border-radius:12px;padding:14px 16px;font:500 14px/1.4 Inter,sans-serif;cursor:pointer;min-height:44px;display:flex;align-items:center}
  .match-item.chip-selected{border-color:#85b4ff;background:#16223d}
  .match-item.matched{border-color:#47a54e;background:#0f2415;cursor:default}
  .match-item.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .why{font:400 13px/1.4 Inter,sans-serif;color:#47a54e;margin-top:4px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e232b;border:1px solid #2a2f38;border-radius:12px;padding:14px 20px;font:500 14px/1.4 Inter,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:10}
  textarea{width:100%;background:#1e232b;border:1px solid #2a2f38;border-radius:12px;color:#fff;font:400 15px/1.5 Inter,sans-serif;padding:14px;resize:vertical;min-height:100px}
  .charcount{font:400 12px/1 Inter,sans-serif;color:#6b6f78;text-align:right;margin-top:6px}
  .job-aid{border:1px solid #2a2f38;background:#1e232b;border-radius:16px;padding:22px}
  .job-aid .item{margin-bottom:14px}
  .job-aid .item b{color:#fff}
  .links{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;cursor:pointer}
  .checkbox-row input{width:20px;height:20px;margin-top:2px}
  .badge{display:inline-block;font:600 12px/1 "JetBrains Mono",monospace;color:#85b4ff;border:1px solid #2a2f38;border-radius:999px;padding:6px 12px;margin-bottom:16px}
  .coach{font:500 14px/1.4 Inter,sans-serif;padding:12px 14px;border-radius:10px;margin-top:8px}
  .coach.good{background:#0f2415;color:#98d69c;border:1px solid #47a54e}
  .coach.bad{background:#2a1a12;color:#ffc273;border:1px solid #fa8e01}
  .sentinel{height:1px}
</style></head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span style="font:700 15px/1 Inter,sans-serif;color:#fff;letter-spacing:.02em">Fivetran</span>
    <div class="eyebrow" id="courseLabel">Winning the Conversational Analytics Conversation</div>
  </div>
  <div class="progress-wrap">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Screen 1 of 12</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="footer-nav" id="footerNav">
    <button class="btn btn-ghost" id="backBtn">Back</button>
    <button class="btn" id="nextBtn">Next</button>
  </div>
</div>


<script>
const STORAGE_KEY = 'ca-course-state-v1';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOTAL_SCREENS = 12;

let state = Object.assign({
  screen: 0,
  prereqAck: false,
  confidencePre: null,
  confidencePost: null,
  score_obj: 0,
  attempts_r1: 0, attempts_r2: 0, attempts_r3: 0,
  r1_done: false, r2_done: false, r3_done: false,
  matched: {}, // screen3 pairs
  freeText: '',
  nextUnlocked: {}
}, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));

function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function setUnlocked(n, v){ state.nextUnlocked[n] = v; persist(); updateNav(); }
function isUnlocked(n){ return !!state.nextUnlocked[n]; }

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

const stage = document.getElementById('stage');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');

function go(n){
  state.screen = Math.max(0, Math.min(TOTAL_SCREENS - 1, n));
  persist();
  render();
}

function updateNav(){
  document.getElementById('progressFill').style.width = ((state.screen+1)/TOTAL_SCREENS*100)+'%';
  document.getElementById('progressLabel').textContent = 'Screen ' + (state.screen+1) + ' of ' + TOTAL_SCREENS;
  backBtn.style.visibility = state.screen === 0 ? 'hidden' : 'visible';
  const last = state.screen === TOTAL_SCREENS - 1;
  document.getElementById('footerNav').style.display = last ? 'none' : 'flex';
  nextBtn.disabled = !isUnlocked(state.screen);
  nextBtn.textContent = state.screen === 0 ? 'Start' : 'Next';
}

backBtn.onclick = () => go(state.screen - 1);
nextBtn.onclick = () => go(state.screen + 1);

const screens = [
  renderS0, renderS1, renderS2, renderS3, renderS4, renderS5,
  (el)=>renderObjection(el, 1), (el)=>renderObjection(el, 2), (el)=>renderObjection(el, 3),
  renderS9, renderS10, renderS11
];

function render(){
  stage.innerHTML = '';
  stage.scrollTop = 0;
  screens[state.screen](stage);
  updateNav();
}

// SCREEN 0
function renderS0(el){
  setUnlocked(0, true);
  el.innerHTML = `
    <div class="badge">~15 min · Self-paced</div>
    <h1>Winning the Conversational Analytics Conversation</h1>
    <p>When you're done, you'll confidently answer the customer questions and objections that come up around Fivetran-powered conversational analytics.</p>
    <p><b style="color:#fff">Before you start (2 min):</b> Skim these so the value story is fresh.</p>
    <div class="links">
      <a href="https://www.fivetran.com/platform-overview" target="_blank" rel="noopener">Fivetran Platform Overview →</a>
      <a href="https://www.fivetran.com/resources/datasheets/the-business-value-of-fivetran" target="_blank" rel="noopener">The Business Value of Fivetran (IDC snapshot) →</a>
      <a href="https://www.fivetran.com/blog/fivetran-value-guide-what-youre-really-getting" target="_blank" rel="noopener">Fivetran Value Guide: What You're Really Getting →</a>
      <a href="https://www.fivetran.com/blog/how-i-used-ai-agents-to-optimize-product-operations" target="_blank" rel="noopener">The story behind this course →</a>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="prereqCheck" ${state.prereqAck?'checked':''}><span>I've reviewed the value-proposition basics.</span></label>
  `;
  document.getElementById('prereqCheck').onchange = (e) => { state.prereqAck = e.target.checked; persist(); };
  nextBtn.onclick = () => {
    if(!state.prereqAck){ showToast('Heads up — this course assumes you know the Fivetran value basics.'); }
    go(state.screen + 1);
  };
}

// SCREEN 1 — confidence pre
function renderS1(el){
  const opts = [['Not yet',1],['Kind of',2],['Bring it on',3]];
  el.innerHTML = `
    <h1>"Why do I even need Fivetran? My AI can just plug into Jira and answer my questions."</h1>
    <p>In the next 15 minutes, you'll learn to love that question.</p>
    <p><b style="color:#fff">First — how ready do you feel to answer it today?</b></p>
    <div class="poll" id="poll1"></div>
  `;
  const poll = el.querySelector('#poll1');
  opts.forEach(([label,val])=>{
    const card = document.createElement('div');
    card.className = 'poll-card' + (state.confidencePre===val ? ' selected':'');
    card.textContent = label;
    card.onclick = () => {
      state.confidencePre = val; persist();
      el.querySelectorAll('.poll-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      setTimeout(()=>setUnlocked(1, true), 400);
    };
    poll.appendChild(card);
  });
  setUnlocked(1, state.confidencePre !== null);
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREEN 2 — teach with counters
function renderS2(el){
  el.innerHTML = `
    <h1>What is conversational analytics?</h1>
    <div class="grid2">
      <div class="panel"><h3>The old way</h3><p>A leader asks, "How much did engineering spend on incidents last month?" An analyst pulls the data, cleans it, models it, and builds a report. That can take days or weeks — and analysts are always swamped.</p></div>
      <div class="panel"><h3>The new way</h3><p>You ask in plain English. An AI agent gives you a real, detailed answer. No dashboards. No SQL. No waiting.</p></div>
    </div>
    <p>Three things work together: generative AI reads your question, agentic AI runs the software, and MCP servers turn language into valid commands.</p>
    <p>Fivetran's own team used this to sort tickets and engineering days across teams — work that would've taken analysts several sprints by hand.</p>
    <div class="counters" id="counters">
      <div class="counter"><div class="num" data-target="28">0</div><div class="lbl">thousand tickets</div></div>
      <div class="counter"><div class="num" data-target="28">0</div><div class="lbl">thousand eng. days</div></div>
      <div class="counter"><div class="num" data-target="51">0</div><div class="lbl">teams</div></div>
    </div>
  `;
  const nums = el.querySelectorAll('.counters .num');
  if(reduceMotion){
    nums.forEach(n=>n.textContent = n.dataset.target + 'k');
  } else {
    nums.forEach(n=>{
      const target = parseInt(n.dataset.target, 10);
      let t0 = null;
      function step(ts){
        if(!t0) t0 = ts;
        const p = Math.min(1, (ts - t0) / 1000);
        n.textContent = Math.round(p * target) + (p===1?'k':'');
        if(p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  setUnlocked(2, true);
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREEN 3 — drag/tap match
function renderS3(el){
  const pairs = [
    { c: 'My analysts are buried.', h: 'Free them up — anyone can ask questions now.', why: 'Removes the analyst bottleneck.' },
    { c: 'Reports take forever.', h: 'Answers in minutes, not sprints.', why: 'Speed is the headline value.' },
    { c: 'Only my SQL folks can dig in.', h: 'Plain English in, real insight out.', why: 'Opens access beyond technical users.' }
  ];
  if(!state.matched || Object.keys(state.matched).length===0) state.matched = {};
  el.innerHTML = `
    <h1>Match the customer to the value hook</h1>
    <p>Tap a value hook, then tap the customer who needs to hear it.</p>
    <div class="match-row">
      <div class="match-col" id="custCol"></div>
      <div class="match-col" id="hookCol"></div>
    </div>
  `;
  const custCol = el.querySelector('#custCol');
  const hookCol = el.querySelector('#hookCol');
  let selectedHook = null;
  const shuffledHooks = [pairs[1], pairs[2], pairs[0]];

  pairs.forEach((p, ci) => {
    const item = document.createElement('div');
    const isMatched = state.matched[ci] !== undefined;
    item.className = 'match-item' + (isMatched ? ' matched' : '');
    item.innerHTML = p.c + (isMatched ? `<div class="why">✓ ${p.why}</div>` : '');
    item.onclick = () => {
      if(isMatched || selectedHook === null) return;
      if(selectedHook.h === p.h){
        state.matched[ci] = true; persist();
        item.classList.add('matched');
        item.innerHTML = p.c + `<div class="why">✓ ${p.why}</div>`;
        selectedHook.el.classList.add('matched');
        selectedHook = null;
        el.querySelectorAll('.match-item.chip-selected').forEach(x=>x.classList.remove('chip-selected'));
        setUnlocked(3, Object.keys(state.matched).length === 3);
      } else {
        item.classList.add('shake');
        setTimeout(()=>item.classList.remove('shake'), 300);
      }
    };
    custCol.appendChild(item);
  });

  shuffledHooks.forEach((p) => {
    const item = document.createElement('div');
    item.className = 'match-item';
    item.textContent = p.h;
    item.onclick = () => {
      if(item.classList.contains('matched')) return;
      el.querySelectorAll('#hookCol .match-item').forEach(x=>x.classList.remove('chip-selected'));
      item.classList.add('chip-selected');
      selectedHook = { h: p.h, el: item };
    };
    hookCol.appendChild(item);
  });

  setUnlocked(3, Object.keys(state.matched).length === 3);
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREEN 4 — MCP trap, scroll or dwell unlock
function renderS4(el){
  el.innerHTML = `
    <h1>The MCP trap</h1>
    <p>Smart prospects will say: "AI agents already connect to my apps through MCP servers. So why add Fivetran?"</p>
    <p>Here's the truth — and it's a great story to tell. MCP servers are built to control apps, not analyze them. Send a big analytics question straight to an app like Jira and you hit two walls fast:</p>
    <div class="grid2">
      <div class="panel"><h3>Wall 1 — Data volume</h3><p>Your question might need thousands of records. The app can't hand them all over.</p></div>
      <div class="panel"><h3>Wall 2 — No context</h3><p>You can't join app data with what makes it useful, like team structure.</p></div>
    </div>
    <p>The fix is simple: use Fivetran to move that data into a central home, like a data lakehouse. Now your agent asks big questions and gets real answers — with context joined in, at low latency, without hammering the app.</p>
    <div class="callout">Talk to apps to control them. Talk to your data warehouse to analyze them.</div>
    <div class="sentinel" id="s4end"></div>
  `;
  let unlocked = false;
  const unlock = () => { if(!unlocked){ unlocked = true; setUnlocked(4, true); } };
  const timer = setTimeout(unlock, 8000);
  const sentinel = el.querySelector('#s4end');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) unlock(); });
  }, { root: el });
  obs.observe(sentinel);
  setUnlocked(4, isUnlocked(4));
  nextBtn.onclick = () => { clearTimeout(timer); obs.disconnect(); go(state.screen + 1); };
}

// SCREEN 5 — spot the dead end
function renderS5(el){
  state._s5 = state._s5 || { a: null, b: null };
  el.innerHTML = `
    <h1>Spot the dead-end</h1>
    <p>Two paths, one question each. Tap your answer, then see the reveal.</p>
    <h2>Path A — Agent goes straight to the app.</h2>
    <p class="muted">Where does this break?</p>
    <div id="qa"></div>
    <h2 style="margin-top:22px">Path B — Agent → Fivetran → lakehouse.</h2>
    <p class="muted">Why does this work?</p>
    <div id="qb"></div>
  `;
  function buildQ(container, opts, correctIdx, key){
    opts.forEach((label, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.textContent = label;
      card.onclick = () => {
        const correct = i === correctIdx;
        card.classList.add(correct ? 'correct' : 'incorrect');
        if(correct){
          state._s5[key] = true; persist();
          card.innerHTML = '✓ ' + label;
          checkDone();
        } else {
          card.innerHTML = '✗ ' + label;
          setTimeout(()=>{ card.classList.remove('incorrect'); card.innerHTML = label; }, 1200);
          showToast('Think back to the two walls…');
        }
      };
      container.appendChild(card);
    });
  }
  buildQ(el.querySelector('#qa'), ['It\'s too slow to set up', 'It hits data limits and can\'t join context', 'It costs too much'], 1, 'a');
  buildQ(el.querySelector('#qb'), ['It skips the data entirely', 'Full data plus context, with low impact on the app', 'It replaces the analyst'], 1, 'b');
  function checkDone(){ setUnlocked(5, state._s5.a && state._s5.b); }
  checkDone();
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREENS 6-8 — objection rounds
const objectionData = {
  1: {
    customer: '"Why not just use MCP directly? My AI can already reach my app."',
    choices: [
      { t: 'MCP is unreliable — I wouldn\'t trust it.', kind: 'weak', coach: 'Don\'t attack MCP. It\'s the right tool for the wrong job here.' },
      { t: 'MCP servers are made to control apps, not analyze them. Big questions hit data limits and can\'t join context. Fivetran centralizes the data so your agent gets real answers.', kind: 'best', coach: 'That\'s the one. Lead with control vs. analyze.' },
      { t: 'You\'d need a lot of custom code to make that work.', kind: 'off', coach: 'True-ish, but it misses the real reason. Lead with control vs. analyze.' }
    ]
  },
  2: {
    customer: '"This sounds like a huge project. Won\'t it take my team weeks?"',
    choices: [
      { t: 'It\'s easy — trust me.', kind: 'weak', coach: 'Back the claim with the sprints-to-hours proof point.' },
      { t: 'It\'s the opposite. Our own team turned multiple analyst sprints into a few hours for one person. Connect off-the-shelf tools, write one short skill file, and ask. Fivetran moves and cleans the data.', kind: 'best', coach: 'That\'s the one. Sprints to hours is the proof point.' },
      { t: 'You\'ll probably need to hire more data engineers first.', kind: 'off', coach: 'That undercuts the pitch — Fivetran removes that load.' }
    ]
  },
  3: {
    customer: '"We already have analysts and dashboards. And do our people need SQL?"',
    choices: [
      { t: 'Honestly, dashboards are kind of outdated now.', kind: 'weak', coach: 'Don\'t knock what they built. Position this as freeing the team.' },
      { t: 'Your analysts stay valuable — this frees them for deeper work. Everyone else asks in plain English and gets answers now. No SQL needed; the AI writes the queries behind the scenes.', kind: 'best', coach: 'That\'s the one. Frees analysts, no SQL required.' },
      { t: 'Yes — your team should really learn SQL to get the most out of it.', kind: 'off', coach: 'The whole point is no SQL required.' }
    ]
  }
};

function renderObjection(el, round){
  const data = objectionData[round];
  const doneKey = 'r' + round + '_done';
  el.innerHTML = `
    <div class="badge">Objection round ${round} of 3 · Scored</div>
    <h1>Customer: ${data.customer}</h1>
    <p>Pick your best response.</p>
    <div id="choices"></div>
    <div id="coachArea"></div>
  `;
  const choicesEl = el.querySelector('#choices');
  const coachArea = el.querySelector('#coachArea');
  const letters = ['A','B','C'];
  data.choices.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<b>${letters[i]}.</b> ${c.t}`;
    card.onclick = () => {
      if(state[doneKey]) return;
      state['attempts_r'+round] = (state['attempts_r'+round]||0) + 1;
      persist();
      if(c.kind === 'best'){
        card.classList.add('correct');
        coachArea.innerHTML = `<div class="coach good">✓ ${c.coach}</div>`;
        if(state['attempts_r'+round] === 1) state.score_obj += 1;
        state[doneKey] = true; persist();
        el.querySelectorAll('#choices .card').forEach(x=>x.classList.add('disabled'));
        setUnlocked(state.screen, true);
      } else {
        card.classList.add('incorrect');
        coachArea.innerHTML = `<div class="coach bad">✗ ${c.coach}</div>`;
        setTimeout(()=>card.classList.remove('incorrect'), 1000);
      }
    };
    choicesEl.appendChild(card);
  });
  if(state[doneKey]){
    coachArea.innerHTML = `<div class="coach good">✓ ${data.choices.find(c=>c.kind==='best').coach}</div>`;
    el.querySelectorAll('#choices .card').forEach((x,i)=>{ if(data.choices[i].kind==='best') x.classList.add('correct'); x.classList.add('disabled'); });
  }
  setUnlocked(state.screen, !!state[doneKey]);
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREEN 9 — confidence post
function renderS9(el){
  const opts = [['Not yet',1],['Kind of',2],['Bring it on',3]];
  const labelFor = v => opts.find(o=>o[1]===v)[0];
  el.innerHTML = `
    <h1>You just handled the three toughest objections.</h1>
    <p><b style="color:#fff">How ready do you feel now?</b></p>
    <div class="poll" id="poll9"></div>
    <div id="delta"></div>
  `;
  const poll = el.querySelector('#poll9');
  const deltaEl = el.querySelector('#delta');
  function renderDelta(){
    if(state.confidencePost === null) return;
    deltaEl.innerHTML = `<div class="callout">${labelFor(state.confidencePre)} → ${labelFor(state.confidencePost)}</div>`;
    if(state.confidencePost < state.confidencePre || state.confidencePost === 1){
      deltaEl.innerHTML += `<p>Want a quick replay? <a href="#" id="replayLink">Revisit the MCP trap →</a></p>`;
      el.querySelector('#replayLink').onclick = (e) => { e.preventDefault(); go(4); };
    }
  }
  opts.forEach(([label,val])=>{
    const card = document.createElement('div');
    card.className = 'poll-card' + (state.confidencePost===val ? ' selected':'');
    card.textContent = label;
    card.onclick = () => {
      state.confidencePost = val; persist();
      el.querySelectorAll('#poll9 .poll-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      setUnlocked(9, true);
      renderDelta();
    };
    poll.appendChild(card);
  });
  renderDelta();
  setUnlocked(9, state.confidencePost !== null);
  nextBtn.onclick = () => go(state.screen + 1);
}

// SCREEN 10 — prove it
function renderS10(el){
  el.innerHTML = `

  const ta = el.querySelector('#freeText');

}
