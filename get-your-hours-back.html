 different.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s16 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 12px\">One warning: freed-up time doesn’t stay free.<\u002Fh2>\n      <p style=\"font-size:17px;color:var(--color-neutral-700);margin:0 0 40px;max-width:640px\">It gets absorbed quietly unless something is holding it. So do these three things.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch\">\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading)\">1<\u002Fdiv><div style=\"font:600 18px var(--font-heading);margin:8px 0 10px\">Book it before you free it.<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">Put the focus block on your calendar first. An empty hour with nothing holding it will be filled by someone else.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading)\">2<\u002Fdiv><div style=\"font:600 18px var(--font-heading);margin:8px 0 10px\">Keep a list of repeats.<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">Any request that shows up twice is your next automation. Write it down the second time, not the fifth.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv><div style=\"font:600 18px var(--font-heading);margin:8px 0 10px\">Check fast, or don’t offload.<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">If verifying the output takes as long as doing the task, that task belongs in the Keep column. Be honest about this one.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:26px 32px;margin-top:32px\">\n        <p style=\"margin:0;font:600 clamp(17px,2vw,21px)/1.5 var(--font-heading)\">This was never about trusting AI. It’s about knowing exactly what you’re trusting it with.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s17 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Your one move this week<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr minmax(300px,380px);gap:40px;align-items:start\">\n        <div>\n          <div style=\"border-top:2px solid var(--color-divider);padding:18px 0;display:grid;grid-template-columns:48px 1fr;gap:14px\"><div style=\"font:700 26px var(--font-heading);color:var(--color-accent)\">1<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.5;align-self:center\">Think of a request that landed on you more than once last month.<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding:18px 0;display:grid;grid-template-columns:48px 1fr;gap:14px\"><div style=\"font:700 26px var(--font-heading);color:var(--color-accent)\">2<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.5;align-self:center\">Run it through the three questions. Does it pass?<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding:18px 0;display:grid;grid-template-columns:48px 1fr;gap:14px\"><div style=\"font:700 26px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.5;align-self:center\">Write the four-part handoff: context, task, constraints, format.<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);padding:18px 0;display:grid;grid-template-columns:48px 1fr;gap:14px\"><div style=\"font:700 26px var(--font-heading);color:var(--color-accent)\">4<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.5;align-self:center\">Save it where you’ll find it again — a Claude Project or a Cursor rules file.<\u002Fp><\u002Fdiv>\n          <sc-if value=\"{{ hasTacit }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:2px solid var(--color-accent);padding:16px 20px;margin-top:24px\">\n              <div style=\"font:600 11px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);margin-bottom:6px\">You wrote this earlier<\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.5\">“{{ tacit }}” — that one lives only in your head. It stays in the Keep column. Everything around it is fair game.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasSavedPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:2px solid var(--color-divider);padding:16px 20px;margin-top:16px\">\n              <div style=\"font:600 11px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);margin-bottom:10px\">You already wrote one — your handoff from Activity 2<\u002Fdiv>\n              <pre style=\"margin:0 0 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:var(--color-neutral-100);padding:12px;user-select:text\">{{ savedPrompt }}<\u002Fpre>\n              <button class=\"btn btn-secondary\" style=\"padding:6px 12px;font-size:13px\" sc-camel-on-click=\"{{ copySavedPrompt }}\">{{ copySavedLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:28px;border:2px solid var(--color-text)\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px\">Take this with you<\u002Fdiv>\n          <div style=\"font:700 24px/1.2 var(--font-heading);margin-bottom:10px\">The Offload Decision Checklist<\u002Fdiv>\n          <p style=\"margin:0 0 20px;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">One page. The three questions, the four-part handoff, and the automation trigger.<\u002Fp>\n          <a href=\"offload-checklist.html\" target=\"_blank\" class=\"btn btn-primary\" style=\"text-decoration:none;display:inline-flex\" sc-camel-on-click=\"{{ trackChecklist }}\">Open the checklist<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:40px 0 0;font:600 20px var(--font-heading)\">Do that four or five times and you have your afternoons back.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n  <footer style=\"flex:none;border-top:2px solid var(--color-divider);display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--color-bg)\">\n    <sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\">\n      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ back }}\">← Back<\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"flex:1;font-size:13px;color:var(--color-neutral-600)\">{{ gateHint }}<\u002Fdiv>\n    <sc-if value=\"{{ showNext }}\" hint-placeholder-val=\"{{ true }}\">\n      <button class=\"btn btn-primary\" disabled=\"{{ nextDisabled }}\" sc-camel-on-click=\"{{ next }}\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;lrsEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;xAPI / LRS&quot;},&quot;lrsAuth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;xAPI / LRS&quot;},&quot;learnerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Learner&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;xAPI / LRS&quot;},&quot;learnerEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;xAPI / LRS&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const ls = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };\n    let a2order;\n    try { a2order = JSON.parse(ls('gyhb-a2order', 'null')); } catch (e) { a2order = null; }\n    if (!a2order) {\n      a2order = [0, 1, 2, 3].map(() => [0, 1, 2].sort(() => Math.random() - 0.5));\n      try { localStorage.setItem('gyhb-a2order', JSON.stringify(a2order)); } catch (e) {}\n    }\n    let a2sel;\n    try { a2sel = JSON.parse(ls('gyhb-a2sel', '[null,null,null,null]')); } catch (e) { a2sel = [null, null, null, null]; }\n    this.a2order = a2order;\n    this.state = {\n      screen: Math.min(16, Math.max(0, +ls('gyhb-screen', 0) || 0)),\n      maxScreen: Math.min(16, Math.max(0, +ls('gyhb-max', 0) || 0)),\n      transcript: false, playing: false,\n      a1: ls('gyhb-a1', '') || null,\n      a3: ls('gyhb-a3', '') || null,\n      a2sel, a2res: null,\n      tacit: ls('gyhb-tacit', ''),\n      savedPrompt: ls('gyhb-prompt', ''),\n      stat23: 23, constraintsOpen: false, cameBackOpen: false,\n      copiedStrong: false, copiedSaved: false\n    };\n    this.c23done = false;\n  }\n\n  // ---------- content ----------\n  get SCREENS() {\n    return ['Title', 'The interrupt tax', 'Straight talk', 'Objectives', 'Tacit vs. explicit', 'The Offload Test', 'Three buckets', 'Activity 1 — Knowledge check', 'The handoff gap', 'The four-part handoff', 'Weak vs. strong', 'Activity 2 — Build a handoff', 'From one-off to automation', 'Where it lives', 'Activity 3 — Scenario', 'Protect the hours', 'Your one move'];\n  }\n  get NARR() {\n    return [\n      \"Think about yesterday. How much of it went to work only you could do? If you're on an IT team, the answer is probably: not much. The day filled up with requests, status updates, tickets, and quick questions. None of it was hard. All of it took time. This course is about getting some of that time back. Not by working faster. By handing off the work that never needed your brain in the first place.\",\n      \"Here's what makes this hard. The requests are small. Pull a report. Update a doc. Explain a config to someone in finance. Each one takes ten minutes. But research from UC Irvine found it takes about twenty-three minutes to get back to focused work after an interruption. So a ten minute favor costs you half an hour. Do four of those and your afternoon is gone. You didn't lose the day to hard work. You lost it to switching.\",\n      \"You have heard big promises about AI. Some of them were nonsense. So let's be clear about what this is. This course will not tell you AI can replace your judgment. It can't. It will not ask you to ship output you haven't checked. And it will not add one more tool for you to babysit. What it will do is give you a test for deciding what's safe to hand off, a prompt pattern that works on the first try, and a way to make it repeat without you.\",\n      \"By the end of the next few minutes, you should be able to use AI to free up real hours in your day. You'll do it in three moves. One: sort your work to find what's safe to hand off. Two: write a handoff that gets usable results the first time. Three: turn that handoff into something that runs again without you. That's the whole course. Let's start with sorting.\",\n      \"Everything you know falls into two piles. The first pile is tacit knowledge. It lives in your head. You earned it. Things like why the twenty-nineteen migration really failed, or which vendor actually answers on a Saturday, or how hard you can push a change window before someone escalates. You can't hand that off, because you can't fully write it down. The second pile is explicit knowledge. It's already written somewhere. The runbook. The ticket history. The naming standard. AI is very good with the second pile. It has none of the first. That difference is the whole game.\",\n      \"So here's the test. Three questions. First: is the knowledge already written down somewhere I can point to? Second: would two good engineers produce roughly the same answer? Third: can I check the result in under two minutes? Three yeses means offload it. Two yeses means let AI draft it and you finish it. Fewer than two, keep it. That last question matters most. If you can't check the work quickly, you haven't saved any time. You've just moved it.\",\n      \"Run your own week through that test and things sort fast. Offload: first drafts of ticket replies, turning a runbook into a checklist, summarizing a sixty-message incident thread, generating test data, renaming things across a pile of files. Assist: change request write-ups, the first pass at a postmortem timeline, refactoring a script you're going to review anyway. Keep: the rollback call. Telling the business no. Anything where the real work is people, risk, or blame. Notice something? The offload column is where most of your interrupts live.\",\n      \"Let's try one. It's four forty on a Friday and four things land on you at once. Which of these is safest to hand to AI right now? Take a second and pick one. After you answer: the answer is B. The knowledge is all in the thread. Two good engineers would summarize it about the same way. And you can check it in a minute by skimming. Three yeses. The other three all fail the test in a different place — read the feedback if you want to see where.\",\n      \"Okay. You've picked something to hand off. Here's where most people quit. They type \\\"summarize this thread,\\\" get back something generic, and decide AI isn't ready. But look at what happened. You gave it a task. You never gave it the job. You didn't say who reads this, what they care about, what to leave out, or what shape it should come back in. Hand that same instruction to a brand-new hire and you'd get the same disappointing result. And you wouldn't blame the new hire.\",\n      \"A good handoff has four parts. Context: who is this for, and what do they already know. Task: the one thing you want done, stated as a verb. Constraints: what to leave out, how long it should be, and what it should never guess at. Format: the exact shape you want it back in. Context, task, constraints, format. Writing all four takes about thirty seconds. It saves you three rounds of rework.\",\n      \"Here's the difference in real life. The weak version is: summarize this incident thread. What comes back is a wall of text that treats every detail as equally important, and you rewrite the whole thing. The strong version tells Claude who's reading it and that she wasn't on the call. It sets limits: under two hundred words, no blame, no names, and if a cause isn't in the thread, say \\\"not determined\\\" instead of guessing. Then it names the exact format: impact, timeline, root cause, open items. That \\\"don't guess\\\" line is the one people skip. It's the one that keeps the output honest.\",\n      \"Your turn. Here's the situation: you need to turn a six-page runbook into a checklist your Tier 1 team can follow at two in the morning. Pick one option for each of the four parts. Watch the prompt build itself on the right as you go. Then run it and see what comes back. There's no penalty for getting it wrong — try a weak option on purpose if you want to see the difference.\",\n      \"Now the part that actually gives you hours back. Doing this once saves you ten minutes. The rule is simple: if you find yourself writing the same prompt a second time, stop. You've found an automation. Save the handoff, then point it at new input each time. You wrote the instructions once. You never write them again.\",\n      \"Two places to put it. For language work that repeats, use a Claude Project. Put your handoff into the project's instructions once. After that, every new conversation in that project already knows the audience, the rules, and the format. You paste in the thread, you get the recap. That covers incident recaps, ticket replies, change write-ups, turning runbooks into checklists. For file and code work that repeats, use Cursor. Put your standards into a rules file so they apply to every request automatically. Then ask for the change across the whole repo instead of opening thirty files. Same four-part handoff either way. You're just storing it instead of retyping it. And you still check the output.\",\n      \"Last one, and this is the real test. It's Tuesday. You blocked ninety minutes to finish the migration plan — the one thing this week that only you can do. Forty minutes in, your team lead messages you. Read the four options and pick the one you'd actually do. After you answer: C is the move. The data is in the ticket system. Two people would pull the same numbers. You can sanity-check it fast. Three yeses. You kept eighty-seven of your ninety minutes — and next time this lands, it costs you three minutes again. Read the other three, though. They're all things reasonable people do, and each one costs you something different.\",\n      \"One warning. Time you free up does not stay free. It gets absorbed quietly unless something is holding it. So do three things. Book the focus time on your calendar before you free it up, not after. Keep a running list of requests that come back more than once — each one is your next automation. And stay honest about checking. If verifying the output takes as long as doing the task, that task belongs in the keep column. This was never about trusting AI. It's about knowing exactly what you're trusting it with.\",\n      \"Here's your one move this week. Think of a request that landed on you more than once last month. Run it through the three questions. If it passes, write the four-part handoff — context, task, constraints, format. Then save it where you'll find it again. That's one recurring interrupt turned into something that handles itself. Do that four or five times and you have your afternoons back. Grab the checklist below. It fits on one page, and it's the whole course.\"\n    ];\n  }\n  get A1() {\n    return [\n      { key: 'A', text: 'Approving an emergency change to the payment gateway.', fb: \"Not this one. Approving an emergency change to a payment system is a risk call. That's tacit knowledge, and it's yours. It fails question two — two engineers might well disagree.\" },\n      { key: 'B', text: \"Turning the 62-message outage thread into a summary for Monday's review.\", fb: 'Right. The knowledge is all in the thread. Two good engineers would summarize it about the same way. And you can check it in a minute by skimming. Three yeses.' },\n      { key: 'C', text: \"Telling the marketing director her request won't make this sprint.\", fb: 'Not this one. This is a relationship, not a task. AI can help you draft the wording later, but the call and the tone are yours.' },\n      { key: 'D', text: 'Choosing which of two vendors to renew.', fb: 'Not this one. A renewal decision depends on things nobody wrote down, like how each vendor actually behaved last year. Fails question one.' }\n    ];\n  }\n  get A3() {\n    return [\n      { key: 'A', text: \"Stop and pull the report yourself. It's only 15 minutes.\", fb: \"It was never 15 minutes. It's 15 minutes plus the 23 it takes to get back into the migration plan. And you'll be asked again next quarter, and it'll still be manual. This is the habit that eats your week.\" },\n      { key: 'B', text: \"Tell them you're heads-down and you'll get to it tomorrow.\", fb: \"Fair. Sometimes it's the right call. But you protected today by creating a problem for tomorrow, and the request will still be manual when it comes back. You delayed the cost. You didn't remove it.\" },\n      { key: 'C', text: 'Run it through your saved handoff, spend 3 minutes checking it, send it, get back to the plan.', fb: 'This is the move. The data is in the ticket system, two people would pull the same numbers, and you can sanity-check it fast. Three yeses on the Offload Test. You kept 87 of your 90 minutes — and the next time this lands, it costs you three minutes again.' },\n      { key: 'D', text: 'Forward it to someone junior on the team.', fb: \"You got your time back by spending someone else's. Sometimes that's right for their growth. Often it just moves the interrupt one desk over — and nobody automates it.\" }\n    ];\n  }\n  get A2ROWS() {\n    return [\n      { label: 'CONTEXT', opts: [\n        { t: '\\u201cIt\\u2019s for a runbook.\\u201d', s: false },\n        { t: '\\u201cFor Tier 1 on-call staff who have never run this procedure and will read it half-asleep at 2 a.m.\\u201d', s: true },\n        { t: '\\u201cFor my team.\\u201d', s: false }] },\n      { label: 'TASK', opts: [\n        { t: '\\u201cMake this better.\\u201d', s: false },\n        { t: '\\u201cConvert this runbook into a numbered checklist of single actions.\\u201d', s: true },\n        { t: '\\u201cLook at this runbook.\\u201d', s: false }] },\n      { label: 'CONSTRAINTS', opts: [\n        { t: '\\u201cKeep it short.\\u201d', s: false },\n        { t: '\\u201cOne action per line. Any step needing judgment gets flagged STOP: escalate. Don\\u2019t invent commands not in the source.\\u201d', s: true },\n        { t: '\\u201cBe thorough.\\u201d', s: false }] },\n      { label: 'FORMAT', opts: [\n        { t: '\\u201cA document.\\u201d', s: false },\n        { t: '\\u201cNumbered checklist with a \\u201cBefore you start\\u201d section and an \\u201cIf this fails\\u201d section.\\u201d', s: true },\n        { t: '\\u201cBullet points.\\u201d', s: false }] }\n    ];\n  }\n  get S11OUT() {\n    return 'IMPACT\\nCheckout was unavailable for 42 minutes (14:07\\u201314:49 UTC). Roughly 1,800 transactions failed and were retried or abandoned. No data loss.\\n\\nTIMELINE\\n\\u2022 14:07 \\u2014 Alerts fire on checkout error rate; on-call engaged\\n\\u2022 14:15 \\u2014 Traced to database connection pool exhaustion\\n\\u2022 14:26 \\u2014 Connection limit raised; partial recovery\\n\\u2022 14:41 \\u2014 13:50 deploy rolled back\\n\\u2022 14:49 \\u2014 Error rate back to baseline; monitoring continued\\n\\nROOT CAUSE\\nThe 13:50 deploy introduced a query that held connections longer than expected, exhausting the pool under afternoon load. Whether a config change contributed: not determined \\u2014 not stated in the thread.\\n\\nOPEN ITEMS\\n\\u2022 Add pool saturation alerting ahead of error-rate alerts\\n\\u2022 Load-test the reverted query before re-deploy\\n\\u2022 Confirm connection limit change is in config management';\n  }\n  get A2OUT() {\n    return {\n      strong: 'BEFORE YOU START\\n\\u25a1 Confirm you are on the jump host (per source runbook, step 0)\\n\\u25a1 Have the incident ticket number ready\\n\\u25a1 If any step below says STOP, page Tier 2 \\u2014 do not proceed\\n\\nRESTART PROCEDURE\\n1. Check service status: systemctl status app-worker\\n2. Copy the last 50 log lines into the ticket\\n3. Stop the worker service\\n4. STOP: escalate \\u2014 if queue depth is above 10,000, page Tier 2 before continuing\\n5. Restart the worker service\\n6. Confirm status shows active (running)\\n7. Watch the queue drain for 5 minutes\\n8. Note the completion time in the ticket\\n\\nIF THIS FAILS\\n\\u25a1 Do not retry more than once\\n\\u25a1 Page Tier 2 with the log lines from step 2\\n\\u25a1 Leave the service stopped \\u2014 do not improvise',\n      mixed: 'RUNBOOK CHECKLIST (draft)\\n\\n1. Check the service status\\n2. Review recent logs for errors\\n3. Stop the affected service\\n4. Restart the service and confirm it is healthy\\n5. Monitor for a few minutes\\n6. Update the ticket\\n\\nNote: several steps in the source involve judgment calls (queue depth, escalation thresholds). This draft does not flag them, and step 4 compresses three separate actions into one line.',\n      weak: 'This runbook describes the restart procedure for the application worker service. It covers checking service status, reviewing logs, stopping and restarting the service, and monitoring afterwards. There are several important considerations around queue depth and escalation that operators should keep in mind. Overall, following these steps carefully should help ensure a smooth restart process. Key themes include preparation, careful execution, and verification. It is recommended that staff familiarize themselves with the entire document before proceeding, and consult senior team members if anything is unclear.'\n    };\n  }\n  get STRONG_PROMPT() {\n    return 'Context: Going to our VP of Infrastructure before Monday\\u2019s review. She wasn\\u2019t on the call.\\nTask: Summarize this thread into an incident recap.\\nConstraints: Under 200 words. No blame, no names. If a cause isn\\u2019t stated in the thread, say \\u201cnot determined\\u201d \\u2014 don\\u2019t guess.\\nFormat: Impact \\u00b7 Timeline (3\\u20135 bullets) \\u00b7 Root cause \\u00b7 Open items';\n  }\n\n  // ---------- xAPI ----------\n  xapi(verb, path, name, result) {\n    const BASE = 'https://learning.example.com/xapi/courses/get-your-hours-back';\n    const email = this.props.learnerEmail || 'anonymous@example.com';\n    const stmt = {\n      actor: { objectType: 'Agent', name: this.props.learnerName || 'Learner', mbox: 'mailto:' + email },\n      verb: { id: 'http://adlnet.gov/expapi/verbs/' + verb, display: { 'en-US': verb } },\n      object: { objectType: 'Activity', id: path ? BASE + '/' + path : BASE, definition: { name: { 'en-US': name }, type: path && path.indexOf('activity') === 0 ? 'http://adlnet.gov/expapi/activities/cmi.interaction' : 'http://adlnet.gov/expapi/activities/' + (path ? 'module' : 'course') } },\n      context: path ? { contextActivities: { parent: [{ id: BASE }] } } : undefined,\n      timestamp: new Date().toISOString()\n    };\n    if (result) stmt.result = result;\n    window.xapiStatements = window.xapiStatements || [];\n    window.xapiStatements.push(stmt);\n    console.info('[xAPI]', verb, name, stmt);\n    const ep = (this.props.lrsEndpoint || '').replace(/\\/+$/, '');\n    if (ep) {\n      const headers = { 'Content-Type': 'application/json', 'X-Experience-API-Version': '1.0.3' };\n      if (this.props.lrsAuth) headers.Authorization = this.props.lrsAuth;\n      fetch(ep + '/statements', { method: 'POST', headers, body: JSON.stringify(stmt) })\n        .catch(err => console.warn('[xAPI] LRS send failed:', err.message));\n    }\n  }\n\n  componentDidMount() {\n    if ('speechSynthesis' in window) speechSynthesis.getVoices(); // warm the voice list\n    this.xapi('initialized', null, 'Get Your Hours Back');\n    this.xapi('experienced', 'screen/' + (this.state.screen + 1), this.SCREENS[this.state.screen]);\n    if (this.state.screen === 1) this.count23();\n  }\n  componentWillUnmount() { this.stopAudio(); clearInterval(this.c23t); }\n\n  // ---------- audio ----------\n  // Recorded narration: drop files into audio/screen-01.mp3 … screen-17.mp3 and they\n  // play automatically; screens without a file fall back to on-device speech.\n  audioFileFor(i) { return 'audio/screen-' + String(i + 1).padStart(2, '0') + '.mp3'; }\n  stopAudio() {\n    clearTimeout(this.ttsTimer);\n    if (this.audioEl) { this.audioEl.pause(); this.audioEl = null; }\n    if ('speechSynthesis' in window) speechSynthesis.cancel();\n    this.ttsPaused = false;\n    if (this.state.playing) this.setState({ playing: false });\n  }\n  pickVoice() {\n    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.indexOf('en') === 0);\n    const pref = ['natural', 'neural', 'google us english', 'samantha', 'aria', 'zira'];\n    for (const p of pref) { const m = vs.find(v => v.name.toLowerCase().indexOf(p) !== -1); if (m) return m; }\n    return vs.find(v => v.default) || vs[0] || null;\n  }\n  speakTts() {\n    speechSynthesis.cancel();\n    const screen = this.state.screen;\n    clearTimeout(this.ttsTimer);\n    // Chrome drops an utterance queued immediately after cancel(); defer one beat.\n    this.ttsTimer = setTimeout(() => {\n      if (this.state.screen !== screen) return;\n      const u = new SpeechSynthesisUtterance(this.NARR[screen]);\n      const v = this.pickVoice();\n      if (v) u.voice = v;\n      u.rate = 1.02;\n      u.onend = () => { this.ttsPaused = false; this.setState({ playing: false }); };\n      u.onerror = (e) => { if (e.error !== 'canceled' && e.error !== 'interrupted') { this.ttsPaused = false; this.setState({ playing: false }); } };\n      speechSynthesis.speak(u);\n    }, 150);\n    this.setState({ playing: true });\n  }\n  toggleAudio = () => {\n    // Playing → pause (resumable)\n    if (this.state.playing) {\n      if (this.audioEl) { this.audioEl.pause(); this.setState({ playing: false }); return; }\n      if ('speechSynthesis' in window && speechSynthesis.speaking) {\n        speechSynthesis.pause(); this.ttsPaused = true; this.setState({ playing: false }); return;\n      }\n      this.stopAudio(); return;\n    }\n    // Paused → resume\n    if (this.audioEl && this.audioEl.currentScreen === this.state.screen && !this.audioEl.ended) {\n      this.audioEl.play(); this.setState({ playing: true }); return;\n    }\n    if (this.ttsPaused && 'speechSynthesis' in window) {\n      speechSynthesis.resume(); this.ttsPaused = false; this.setState({ playing: true }); return;\n    }\n    // Fresh start: try the recorded file for this screen, fall back to speech\n    this.stopAudio();\n    const el = new Audio(this.audioFileFor(this.state.screen));\n    el.currentScreen = this.state.screen;\n    let fellBack = false;\n    const fallback = () => {\n      if (fellBack) return;\n      fellBack = true;\n      this.audioEl = null;\n      if ('speechSynthesis' in window) this.speakTts();\n    };\n    el.onended = () => { this.audioEl = null; this.setState({ playing: false }); };\n    el.onerror = fallback;\n    el.play().then(() => {\n      this.audioEl = el;\n      this.setState({ playing: true });\n    }).catch(fallback);\n  };\n\n  // ---------- nav ----------\n  persist(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }\n  count23() {\n    if (this.c23done) return;\n    this.c23done = true;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    let v = 0;\n    this.setState({ stat23: 0 });\n    this.c23t = setInterval(() => {\n      v += 1;\n      if (v >= 23) { v = 23; clearInterval(this.c23t); }\n      this.setState({ stat23: v });\n    }, 45);\n  }\n  goTo(i) {\n    if (i < 0 || i > 16 || i === this.state.screen) return;\n    this.stopAudio();\n    const max = Math.max(this.state.maxScreen, i);\n    this.setState({ screen: i, maxScreen: max, copiedStrong: false, copiedSaved: false });\n    this.persist('gyhb-screen', i); this.persist('gyhb-max', max);\n    this.xapi('experienced', 'screen/' + (i + 1), this.SCREENS[i]);\n    if (i === 1) this.count23();\n    if (i === 16) {\n      let done = false;\n      try { done = localStorage.getItem('gyhb-completed') === '1'; } catch (e) {}\n      if (!done) {\n        this.xapi('completed', null, 'Get Your Hours Back', { completion: true });\n        this.persist('gyhb-completed', '1');\n      }\n    }\n    const m = document.querySelector('main'); if (m) m.scrollTop = 0;\n  }\n\n  // ---------- render ----------\n  renderVals() {\n    const st = this.state;\n    const vals = {};\n    for (let i = 0; i < 17; i++) vals['s' + (i + 1)] = st.screen === i;\n    const gated = (st.screen === 7 && !st.a1) || (st.screen === 14 && !st.a3);\n    const moveLabel = st.screen >= 4 && st.screen <= 7 ? 'MOVE 1 · SORT' : st.screen >= 8 && st.s
