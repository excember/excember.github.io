  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"98ee1cb7-9f3e-414a-a9eb-ab6d9d294c51\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"9c0b8c67-4c81-46c4-8c37-65e76a02d1bc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"9c9fc4fc-36c2-4304-bb1c-fc5a5d1a9636\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"98ee1cb7-9f3e-414a-a9eb-ab6d9d294c51\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"9c0b8c67-4c81-46c4-8c37-65e76a02d1bc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"64ff9dde-3972-415b-950b-cd2b9a0617ca\"><\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0;background:var(--color-bg);}\na{color:var(--color-accent-700);}a:hover{color:var(--color-accent);}\n::selection{background:var(--color-accent-200);}\n@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;flex-direction:column;height:100vh;font-family:var(--font-body);color:var(--color-text);background:var(--color-bg)\">\n  <header style=\"border-bottom:2px solid var(--color-divider);flex:none\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap\">\n      <div style=\"font:700 13px var(--font-heading);letter-spacing:0.08em;text-transform:uppercase\">Get Your Hours Back<\u002Fdiv>\n      <sc-if value=\"{{ moveLabel }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-neutral\">{{ moveLabel }}<\u002Fspan><\u002Fsc-if>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <sc-if value=\"{{ testUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n        <button class=\"btn btn-ghost\" style=\"padding:6px 12px;font-size:13px\" sc-camel-on-click=\"{{ goTest }}\">The Test<\u002Fbutton>\n      <\u002Fsc-if>\n      <button class=\"btn btn-ghost\" style=\"padding:6px 12px;font-size:13px\" aria-pressed=\"{{ transcriptOpen }}\" sc-camel-on-click=\"{{ toggleTranscript }}\">{{ transcriptLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ audioSupported }}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"btn btn-secondary\" style=\"padding:6px 12px;font-size:13px\" sc-camel-on-click=\"{{ toggleAudio }}\">{{ audioLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.06em;color:var(--color-neutral-600)\">{{ counter }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:4px;background:var(--color-neutral-200)\" role=\"progressbar\" aria-label=\"Course progress\"><div style=\"height:4px;background:var(--color-accent);width:{{ progressPct }}\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fheader>\n  <sc-if value=\"{{ transcriptOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:none;border-bottom:2px solid var(--color-divider);background:var(--color-neutral-100);max-height:32vh;overflow-y:auto\">\n      <div style=\"max-width:1120px;margin:0 auto;padding:16px 32px\">\n        <div style=\"font:600 11px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px\">Audio transcript — {{ screenLabel }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;user-select:text\">{{ transcriptText }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <main style=\"flex:1;overflow-y:auto\">\n\n  <sc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:var(--color-text);color:var(--color-bg);min-height:100%;box-sizing:border-box\">\n      <div style=\"max-width:1120px;margin:0 auto;padding:72px 32px 80px;box-sizing:border-box\">\n        <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300)\">Microlearning · 8 min<\u002Fdiv>\n        <h1 style=\"font:700 clamp(44px,6vw,76px)/1.02 var(--font-heading);margin:20px 0 12px;letter-spacing:-0.02em\">Get Your Hours Back<\u002Fh1>\n        <p style=\"font-size:20px;margin:0 0 48px;color:var(--color-neutral-300)\">Using AI to offload the work that never needed you<\u002Fp>\n        <div style=\"border-left:4px solid var(--color-accent);padding-left:24px;margin:0 0 56px\">\n          <p style=\"font:600 clamp(22px,2.6vw,30px)/1.3 var(--font-heading);margin:0\">You didn’t lose the day to hard work.<br>You lost it to other people’s work.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:820px\">\n          <div style=\"border-top:2px solid var(--color-neutral-600);padding-top:12px;font-size:15px\"><strong style=\"font-family:var(--font-heading)\">3<\u002Fstrong> hands-on activities<\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-neutral-600);padding-top:12px;font-size:15px\"><strong style=\"font-family:var(--font-heading)\">1<\u002Fstrong> one-page checklist to keep<\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-neutral-600);padding-top:12px;font-size:15px\"><strong style=\"font-family:var(--font-heading)\">No<\u002Fstrong> prior AI experience needed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px;letter-spacing:-0.01em\">It’s not the workload. It’s the switching.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:40px;align-items:start\">\n        <div class=\"card\" style=\"padding:32px;border:2px solid var(--color-text)\">\n          <div style=\"font:700 96px/1 var(--font-heading);letter-spacing:-0.03em\" aria-hidden=\"true\">{{ stat23 }}<\u002Fdiv>\n          <span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)\">23<\u002Fspan>\n          <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin:4px 0 16px\">Minutes<\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:16px;line-height:1.5\">The average time it takes to get back to focused work after an interruption.<\u002Fp>\n          <p style=\"margin:0;font-size:13px;color:var(--color-neutral-600)\">(Mark et al., UC Irvine)<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"border-top:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading)\">1<\u002Fdiv>\n            <div><div style=\"font:600 19px var(--font-heading);margin-bottom:6px\">The ask is small.<\u002Fdiv><p style=\"margin:0;color:var(--color-neutral-700);font-size:15px\">“Quick question” · “Can you pull that report?” · “Just 10 minutes.”<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading)\">2<\u002Fdiv>\n            <div><div style=\"font:600 19px var(--font-heading);margin-bottom:6px\">The switch is not.<\u002Fdiv><p style=\"margin:0;color:var(--color-neutral-700);font-size:15px\">10 minutes of work + 23 minutes of getting back = 33 minutes gone.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv>\n            <div><div style=\"font:600 19px var(--font-heading);margin-bottom:6px\">The day is gone.<\u002Fdiv><p style=\"margin:0;color:var(--color-neutral-700);font-size:15px\">Four of those and your whole afternoon disappeared into nothing hard.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s3 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 12px\">First, some straight talk.<\u002Fh2>\n      <p style=\"font-size:17px;color:var(--color-neutral-700);margin:0 0 40px;max-width:640px\">You’ve heard big AI promises. Some of them were nonsense. So let’s be clear about what this is.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch\">\n        <div class=\"card\" style=\"padding:28px\">\n          <div style=\"font:600 13px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);border-bottom:2px solid var(--color-divider);padding-bottom:12px;margin-bottom:20px\">This course will not<\u002Fdiv>\n          <div style=\"display:grid;gap:18px\">\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"color:var(--color-accent);font-weight:700\" aria-hidden=\"true\">✕<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Tell you AI can replace your judgment. It can’t.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"color:var(--color-accent);font-weight:700\" aria-hidden=\"true\">✕<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Ask you to ship anything you haven’t checked.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"color:var(--color-accent);font-weight:700\" aria-hidden=\"true\">✕<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Hand you one more tool to babysit.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:28px;border:2px solid var(--color-text)\">\n          <div style=\"font:600 13px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;border-bottom:2px solid var(--color-text);padding-bottom:12px;margin-bottom:20px\">This course will<\u002Fdiv>\n          <div style=\"display:grid;gap:18px\">\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"font-weight:700\" aria-hidden=\"true\">✓<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Give you a test for what’s safe to hand off.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"font-weight:700\" aria-hidden=\"true\">✓<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Give you a prompt pattern that works the first try.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px 1fr;gap:12px\"><span style=\"font-weight:700\" aria-hidden=\"true\">✓<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Show you how to make it repeat without you.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">Everything here assumes you will check the output. That’s not a weakness of the method. That’s the method.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s4 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 32px\">What you’ll be able to do<\u002Fh2>\n      <div style=\"background:var(--color-accent);color:#fff;padding:28px 32px;margin-bottom:32px\">\n        <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:10px;opacity:0.85\">Terminal objective<\u002Fdiv>\n        <p style=\"margin:0;font:600 clamp(18px,2.2vw,24px)/1.4 var(--font-heading)\">Use AI tools to free up more hours of your day for focused work — by offloading tasks and automating work that doesn’t need your tacit knowledge or expertise.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n        <sc-for list=\"{{ moves }}\" as=\"mv\" hint-placeholder-count=\"3\">\n          <div class=\"card\" style=\"padding:24px;cursor:{{ mv.cursor }};border:{{ mv.border }}\" sc-camel-on-click=\"{{ mv.jump }}\" role=\"{{ mv.role }}\" sc-camel-tab-index=\"{{ mv.tab }}\">\n            <div style=\"font:700 40px var(--font-heading);color:var(--color-accent)\">{{ mv.n }}<\u002Fdiv>\n            <div style=\"font:600 20px var(--font-heading);margin:8px 0 10px\">{{ mv.title }}<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">{{ mv.desc }}<\u002Fp>\n            <sc-if value=\"{{ mv.unlocked }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px;font:600 12px var(--font-heading);letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700)\">Jump to this move →<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:32px 0 0;font:600 18px var(--font-heading)\">Three moves. That’s the whole course.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s5 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 1 · Sort<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Everything you know sits in one of two piles.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch\">\n        <div class=\"card\" style=\"padding:28px;border-top:6px solid var(--color-accent)\">\n          <div style=\"font:700 22px var(--font-heading);margin-bottom:6px\">TACIT<\u002Fdiv>\n          <p style=\"margin:0 0 20px;font-size:14px;color:var(--color-neutral-700)\">Lives in your head. Earned. Hard to write down.<\u002Fp>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:12px\">\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">Why the 2019 migration really failed<\u002Fli>\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">Which vendor actually answers on a Saturday<\u002Fli>\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">How hard you can push a change window<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:28px;border-top:6px solid var(--color-text)\">\n          <div style=\"font:700 22px var(--font-heading);margin-bottom:6px\">EXPLICIT<\u002Fdiv>\n          <p style=\"margin:0 0 20px;font-size:14px;color:var(--color-neutral-700)\">Already written down somewhere. Findable. Repeatable.<\u002Fp>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:12px\">\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">The runbook steps<\u002Fli>\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">The ticket history and the thread<\u002Fli>\n            <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:15px\">The naming standard and the config<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin:24px 0 40px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">AI is very good at the right-hand pile. It has none of the left-hand pile. That difference is the whole game.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\" style=\"max-width:640px\">\n        <label for=\"tacit-input\" style=\"font:600 13px var(--font-heading);letter-spacing:0.06em\">Name one thing you know that isn’t written down anywhere (optional — it comes back at the end)<\u002Flabel>\n        <input id=\"tacit-input\" class=\"input\" type=\"text\" value=\"{{ tacit }}\" sc-camel-on-change=\"{{ setTacit }}\" placeholder=\"e.g. why we never patch on Thursdays\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s6 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 1 · Sort<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">The Offload Test: three questions<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr minmax(280px,340px);gap:40px;align-items:start\">\n        <div>\n          <div style=\"border-top:2px solid var(--color-divider);padding:22px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading)\">1<\u002Fdiv>\n            <div><div style=\"font:600 19px/1.35 var(--font-heading);margin-bottom:6px\">Is the knowledge already written down somewhere I can point to?<\u002Fdiv><p style=\"margin:0;color:var(--color-neutral-700);font-size:14px\">Thread, ticket, runbook, repo, doc.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding:22px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading)\">2<\u002Fdiv>\n            <div><div style=\"font:600 19px/1.35 var(--font-heading);margin-bottom:6px\">Would two good engineers produce roughly the same answer?<\u002Fdiv><p style=\"margin:0;color:var(--color-neutral-700);font-size:14px\">If it depends on who does it, it’s judgment.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);padding:22px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 32px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv>\n            <div><div style=\"font:600 19px/1.35 var(--font-heading);margin-bottom:6px\">Can I check the result in under two minutes?<\u002Fdiv><p style=\"margin:0;color:var(--color-accent-700);font-size:14px;font-weight:600\">This one matters most.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px;border:2px solid var(--color-text)\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px\">Score it<\u002Fdiv>\n          <div style=\"display:grid;gap:14px\">\n            <div style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><div style=\"font:700 16px var(--font-heading)\">3 yeses<\u002Fdiv><div style=\"font-size:14px;color:var(--color-neutral-700)\">Offload it.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><div style=\"font:700 16px var(--font-heading)\">2 yeses<\u002Fdiv><div style=\"font-size:14px;color:var(--color-neutral-700)\">AI drafts, you finish.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><div style=\"font:700 16px var(--font-heading);color:var(--color-accent)\">0–1 yeses<\u002Fdiv><div style=\"font-size:14px;color:var(--color-neutral-700)\">Keep it. It’s yours.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:32px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">If you can’t verify it fast, you haven’t saved time — you’ve just moved it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s7 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 1 · Sort<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 8px\">Run your own week through it.<\u002Fh2>\n      <p style=\"font-size:14px;color:var(--color-neutral-600);margin:0 0 32px\">Hover any item to see how it scores on the three questions.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch\">\n        <sc-for list=\"{{ s7cols }}\" as=\"col\" hint-placeholder-count=\"3\">\n          <div class=\"card\" style=\"padding:24px;border-top:{{ col.topBorder }}\">\n            <div style=\"font:700 16px var(--font-heading);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;color:{{ col.titleColor }}\">{{ col.name }}<\u002Fdiv>\n            <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:12px\">\n              <sc-for list=\"{{ col.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n                <li style=\"border-top:1px solid var(--color-divider);padding-top:12px;font-size:14px;line-height:1.45\"><span title=\"{{ item.tip }}\" style=\"border-bottom:1px dotted var(--color-neutral-500);cursor:help\">{{ item.t }}<\u002Fspan><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">Notice where your interrupts live. Almost all of them are in the first column.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s8 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:900px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Activity 1 · Knowledge check<\u002Fdiv>\n      <h2 style=\"font:700 clamp(28px,3.6vw,40px)/1.15 var(--font-heading);margin:0 0 8px\">It’s 4:40 on Friday. Four things land at once.<\u002Fh2>\n      <p style=\"font-size:18px;margin:0 0 32px\">Which one is safest to hand to AI right now?<\u002Fp>\n      <div style=\"display:grid;gap:14px\">\n        <sc-for list=\"{{ a1opts }}\" as=\"opt\" hint-placeholder-count=\"4\">\n          <div>\n            <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\" aria-pressed=\"{{ opt.selected }}\">\n              <span style=\"font:700 18px var(--font-heading);width:32px;flex:none\">{{ opt.key }}<\u002Fspan>\n              <span style=\"font-size:16px;line-height:1.5;text-align:left\">{{ opt.text }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ opt.showFb }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:2px solid var(--color-divider);border-top:0;padding:14px 18px;font-size:14px;line-height:1.55;background:var(--color-neutral-100)\">{{ opt.fb }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ a1answered }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:8px\">Correct: B<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55\">The knowledge is all in the thread. Two people would summarize it about the same way. You can check it in a minute by skimming. <strong>Three yeses.<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s9 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:var(--color-text);color:var(--color-bg);min-height:100%;box-sizing:border-box\">\n      <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n        <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:12px\">Move 2 · Hand off<\u002Fdiv>\n        <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Why good tasks come back as bad work<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:1fr 40px 1fr;gap:20px;align-items:center;margin-bottom:32px\">\n          <div style=\"border:2px solid var(--color-neutral-600);padding:24px\">\n            <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-400);margin-bottom:14px\">You typed<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:16px;background:rgba(255,255,255,0.06);padding:14px 16px;margin-bottom:14px\">“Summarize this thread.”<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-300)\">You got back something generic. You decided AI wasn’t ready.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"font:700 28px var(--font-heading);text-align:center\" aria-hidden=\"true\">→<\u002Fdiv>\n          <div style=\"border:2px solid var(--color-accent);padding:24px\">\n            <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:14px\">What actually happened<\u002Fdiv>\n            <p style=\"margin:0 0 10px;font:600 18px/1.4 var(--font-heading)\">You gave it a task.<br>You never gave it the job.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:var(--color-neutral-300)\">No audience. No limits. No shape.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--color-accent);color:#fff;padding:22px 28px\">\n          <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">Hand that same one-line instruction to a brand-new hire and you’d get the same disappointing result — and you wouldn’t blame the new hire.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s10 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 2 · Hand off<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">A good handoff has four parts.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr minmax(260px,320px);gap:40px;align-items:start\">\n        <div>\n          <div style=\"border-top:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 30px var(--font-heading)\">1<\u002Fdiv>\n            <div><div style=\"font:700 16px var(--font-heading);letter-spacing:0.08em;margin-bottom:4px\">CONTEXT<\u002Fdiv><p style=\"margin:0;font-size:15px;color:var(--color-neutral-700)\">Who is this for, and what do they already know?<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 30px var(--font-heading)\">2<\u002Fdiv>\n            <div><div style=\"font:700 16px var(--font-heading);letter-spacing:0.08em;margin-bottom:4px\">TASK<\u002Fdiv><p style=\"margin:0;font-size:15px;color:var(--color-neutral-700)\">The one thing you want done — stated as a verb.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-accent);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 30px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv>\n            <div>\n              <div style=\"font:700 16px var(--font-heading);letter-spacing:0.08em;margin-bottom:4px\">CONSTRAINTS<\u002Fdiv>\n              <p style=\"margin:0 0 8px;font-size:15px;color:var(--color-neutral-700)\">What to leave out, how long, and what it must never guess at.<\u002Fp>\n              <button class=\"btn btn-ghost\" style=\"padding:4px 0;font-size:13px;border:0;text-decoration:underline\" sc-camel-on-click=\"{{ toggleConstraints }}\">Why constraints matter most<\u002Fbutton>\n              <sc-if value=\"{{ constraintsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:2px solid var(--color-divider);padding:14px 16px;margin-top:8px;font-size:14px;line-height:1.55;background:var(--color-neutral-100)\">Constraints are what stop the model from inventing. Without “don’t guess”, a model fills gaps with plausible-sounding detail. Without a length limit, it pads. Without “leave out X”, scope creeps. Constraints are the part people skip — and the part that keeps the output honest and checkable in under two minutes.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:56px 1fr;gap:16px\">\n            <div style=\"font:700 30px var(--font-heading)\">4<\u002Fdiv>\n            <div><div style=\"font:700 16px var(--font-heading);letter-spacing:0.08em;margin-bottom:4px\">FORMAT<\u002Fdiv><p style=\"margin:0;font-size:15px;color:var(--color-neutral-700)\">The exact shape you want it back in.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:28px;border:2px solid var(--color-text)\">\n          <div style=\"font:700 72px/1 var(--font-heading);letter-spacing:-0.02em\">30<\u002Fdiv>\n          <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin:4px 0 14px\">Seconds<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.5\">to write all four.<br><strong>Saves you three rounds of rework.<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:32px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">Context · Task · Constraints · Format — in that order, every time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s11 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 2 · Hand off<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Same task. Two handoffs.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:start\">\n        <div class=\"card\" style=\"padding:24px\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:14px\">Weak<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--color-neutral-100);border:1px solid var(--color-divider);padding:14px 16px;margin-bottom:20px\">Summarize this incident thread.<\u002Fdiv>\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">What comes back<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">A wall of text that treats every detail as equally important. You rewrite the whole thing. Net time saved: zero.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px;border:2px solid var(--color-text)\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px\">Strong<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6;background:var(--color-neutral-100);border:1px solid var(--color-divider);padding:16px;display:grid;gap:10px\">\n            <div><strong style=\"font-family:var(--font-heading);color:var(--color-accent-700)\">CONTEXT&nbsp;<\u002Fstrong> Going to our VP of Infrastructure before Monday’s review. She wasn’t on the call.<\u002Fdiv>\n            <div><strong style=\"font-family:var(--font-heading);color:var(--color-accent-700)\">TASK&nbsp;<\u002Fstrong> Summarize this thread into an incident recap.<\u002Fdiv>\n            <div><strong style=\"font-family:var(--font-heading);color:var(--color-accent-700)\">CONSTRAINTS&nbsp;<\u002Fstrong> Under 200 words. No blame, no names. If a cause isn’t stated in the thread, say “not determined” — don’t guess.<\u002Fdiv>\n            <div><strong style=\"font-family:var(--font-heading);color:var(--color-accent-700)\">FORMAT&nbsp;<\u002Fstrong> Impact · Timeline (3–5 bullets) · Root cause · Open items<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;margin-top:16px\">\n            <button class=\"btn btn-secondary\" style=\"padding:8px 14px;font-size:13px\" sc-camel-on-click=\"{{ copyStrongPrompt }}\">{{ copyPromptLabel }}<\u002Fbutton>\n            <button class=\"btn btn-ghost\" style=\"padding:8px 14px;font-size:13px\" sc-camel-on-click=\"{{ toggleCameBack }}\">{{ cameBackLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ cameBackOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <pre style=\"margin:16px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;background:var(--color-neutral-100);border:1px solid var(--color-divider);padding:16px;user-select:text\">{{ s11output }}<\u002Fpre>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">The “don’t guess — say not determined” line is the one people skip. It’s the one that keeps the output honest.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s12 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Activity 2 · Build a handoff<\u002Fdiv>\n      <h2 style=\"font:700 clamp(28px,3.6vw,40px)/1.15 var(--font-heading);margin:0 0 16px\">Your turn. Build the handoff.<\u002Fh2>\n      <div style=\"border:2px solid var(--color-text);padding:16px 20px;margin-bottom:32px;max-width:820px\">\n        <span style=\"font:600 12px var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent);margin-right:10px\">Scenario<\u002Fspan>\n        <span style=\"font-size:15px\">Turn a 6-page runbook into a checklist your Tier 1 team can follow at 2 a.m. Pick one option per part. There’s no penalty — try a weak option on purpose if you want to see the difference.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:start\">\n        <div style=\"display:grid;gap:24px\">\n          <sc-for list=\"{{ a2rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font:700 14px var(--font-heading);letter-spacing:0.1em;margin-bottom:10px\"><span style=\"color:var(--color-accent)\">{{ row.n }}<\u002Fspan>&nbsp; {{ row.label }}<\u002Fdiv>\n              <div style=\"display:grid;gap:8px\">\n                <sc-for list=\"{{ row.opts }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\" aria-pressed=\"{{ opt.selected }}\">{{ opt.t }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"position:sticky;top:24px\">\n          <div class=\"card\" style=\"padding:24px;border:2px solid var(--color-text)\">\n            <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px\">Your prompt, assembling live<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;background:var(--color-neutral-100);border:1px solid var(--color-divider);padding:16px;display:grid;gap:8px;user-select:text\">\n              <sc-for list=\"{{ a2preview }}\" as=\"line\" hint-placeholder-count=\"4\">\n                <div style=\"color:{{ line.color }}\"><strong style=\"font-family:var(--font-heading)\">{{ line.label }}:<\u002Fstrong> {{ line.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"margin-top:16px\" disabled=\"{{ a2runDisabled }}\" sc-camel-on-click=\"{{ runA2 }}\">Run it<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ a2hasResult }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"padding:24px;margin-top:16px\">\n              <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">What came back<\u002Fdiv>\n              <pre style=\"margin:0 0 16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:var(--color-neutral-100);border:1px solid var(--color-divider);padding:14px;max-height:320px;overflow-y:auto;user-select:text\">{{ a2output }}<\u002Fpre>\n              <div style=\"border-top:2px solid var(--color-divider);padding-top:14px;font-size:14px;line-height:1.55\">{{ a2feedback }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s13 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 3 · Automate<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Do it once. Then never again.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 36px 1fr 36px 1fr;gap:16px;align-items:stretch\">\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading);color:var(--color-accent)\">1<\u002Fdiv><div style=\"font:600 19px var(--font-heading);margin:6px 0 8px\">Do it once<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">Write the four-part handoff. Check the output. Fix what’s off.<\u002Fp><\u002Fdiv>\n        <div style=\"font:700 26px var(--font-heading);align-self:center;text-align:center\" aria-hidden=\"true\">→<\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading);color:var(--color-accent)\">2<\u002Fdiv><div style=\"font:600 19px var(--font-heading);margin:6px 0 8px\">Save the handoff<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">Store the instructions where the tool will reuse them.<\u002Fp><\u002Fdiv>\n        <div style=\"font:700 26px var(--font-heading);align-self:center;text-align:center\" aria-hidden=\"true\">→<\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px\"><div style=\"font:700 36px var(--font-heading);color:var(--color-accent)\">3<\u002Fdiv><div style=\"font:600 19px var(--font-heading);margin:6px 0 8px\">Point it at new input<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-700)\">New thread, new repo, new ticket. Same instructions. No retyping.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-accent);color:#fff;padding:26px 32px;margin-top:32px\">\n        <p style=\"margin:0;font:600 clamp(18px,2.2vw,23px)/1.45 var(--font-heading)\">If you catch yourself writing the same prompt a second time — stop. You’ve just found an automation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s14 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Move 3 · Automate<\u002Fdiv>\n      <h2 style=\"font:700 clamp(30px,4vw,44px)/1.1 var(--font-heading);margin:0 0 40px\">Two places to put it.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch\">\n        <div class=\"card\" style=\"padding:28px;display:flex;flex-direction:column;gap:16px\">\n          <div><div style=\"font:700 22px var(--font-heading)\">CLAUDE<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-600)\">for language work that repeats<\u002Fdiv><\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6\">Put your handoff into a Project’s instructions once. Every new conversation in that project already knows the audience, the rules, and the format. Paste in the thread — get the recap.<\u002Fp>\n          <div style=\"border:2px solid var(--color-divider)\" role=\"img\" aria-label=\"Diagram: where the handoff lives in a Claude Project — the project instructions panel\">\n            <div style=\"display:flex;border-bottom:2px solid var(--color-divider)\">\n              <div style=\"width:34%;border-right:2px solid var(--color-divider);padding:10px 12px;background:var(--color-neutral-100)\">\n                <div style=\"font:600 10px var(--font-heading);letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Project<\u002Fdiv>\n                <div style=\"font:600 12px var(--font-heading)\">Incident recaps<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--color-neutral-600);margin-top:8px\">Chats<br>Files<br><span style=\"color:var(--color-accent);font-weight:700\">Instructions ←<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px 12px\">\n                <div style=\"font:600 10px var(--font-heading);letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Project instructions<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.55;color:var(--color-neutral-700)\">Context: recaps go to the VP of Infra…<br>Task: summarize the pasted thread…<br>Constraints: under 200 words, don’t guess…<br>Format: Impact · Timeline · Root cause…<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 12px;font-size:11.5px;background:var(--color-accent);color:#fff;font-weight:600\">Your four-part handoff goes here — once.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;border-top:2px solid var(--color-divider);padding-top:12px;font-size:13px;color:var(--color-neutral-700)\">Incident recaps · ticket replies · change write-ups · runbooks → checklists<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:28px;display:flex;flex-direction:column;gap:16px\">\n          <div><div style=\"font:700 22px var(--font-heading)\">CURSOR<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-600)\">for file and code work that repeats<\u002Fdiv><\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6\">Put your standards into a rules file so they apply to every request automatically. Then ask for the change across the whole repo instead of opening thirty files one at a time.<\u002Fp>\n          <div style=\"border:2px solid var(--color-divider)\" role=\"img\" aria-label=\"Diagram: where standards live in Cursor — a rules file in the repository\">\n            <div style=\"display:flex;border-bottom:2px solid var(--color-divider)\">\n              <div style=\"width:34%;border-right:2px solid var(--color-divider);padding:10px 12px;background:var(--color-neutral-100)\">\n                <div style=\"font:600 10px var(--font-heading);letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Repo<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.7;color:var(--color-neutral-700)\">src/<br>scripts/<br><span style=\"color:var(--color-accent);font-weight:700\">.cursor/rules ←<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:10px 12px\">\n                <div style=\"font:600 10px var(--font-heading);letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">team-standards<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.55;color:var(--color-neutral-700)\">Follow the naming standard in docs/naming.md.<br>Never invent commands not in the runbook.<br>All scripts get error handling + logging…<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 12px;font-size:11.5px;background:var(--color-accent);color:#fff;font-weight:600\">Standards apply to every request — automatically.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;border-top:2px solid var(--color-divider);padding-top:12px;font-size:13px;color:var(--color-neutral-700)\">Bulk renames · adding logging to a pattern · tests for existing code · first-pass script updates<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n        <p style=\"margin:0;font:600 17px/1.5 var(--font-heading)\">Same four-part handoff either way. You’re storing it instead of retyping it. Still check the output.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;color:var(--color-neutral-600)\">Interface details last verified August 2026.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ s15 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:900px;margin:0 auto;padding:56px 32px 80px;box-sizing:border-box\">\n      <div style=\"font:600 13px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:12px\">Activity 3 · Scenario<\u002Fdiv>\n      <h2 style=\"font:700 clamp(28px,3.6vw,40px)/1.15 var(--font-heading);margin:0 0 20px\">It’s Tuesday. The interrupt arrives.<\u002Fh2>\n      <div style=\"border:2px solid var(--color-text);padding:20px 24px;margin-bottom:32px;font-size:16px;line-height:1.6\">\n        You blocked 90 minutes to finish the migration plan — the one thing this week only you can do. Forty minutes in, your team lead messages: <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:14.5px;background:var(--color-neutral-100);padding:2px 6px\">“Can you pull last quarter’s ticket volume by category for the steering committee? They meet at 3.”<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:14px\">\n        <sc-for list=\"{{ a3opts }}\" as=\"opt\" hint-placeholder-count=\"4\">\n          <div>\n            <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\" aria-pressed=\"{{ opt.selected }}\">\n              <span style=\"font:700 18px var(--font-heading);width:32px;flex:none\">{{ opt.key }}<\u002Fspan>\n              <span style=\"font-size:16px;line-height:1.5;text-align:left\">{{ opt.text }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ opt.showFb }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:2px solid var(--color-divider);border-top:0;padding:14px 18px;font-size:14px;line-height:1.55;background:var(--color-neutral-100)\">{{ opt.fb }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ a3answered }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--color-text);color:var(--color-bg);padding:22px 28px;margin-top:24px\">\n          <div style=\"font:600 12px var(--font-heading);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-300);margin-bottom:8px\">Best: C<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55\">Three yeses on the Offload Test. <strong>You kept 87 of your 90 minutes<\u002Fstrong> — and the next time this lands, it costs you three minutes again. The other three are all things reasonable people do, and each one costs you something
